<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.55;0.35" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.6;0.35" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow-text" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#818cf8" flood-opacity="0.4" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .floating-card { transition: all 0.3s ease; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />

  <!-- Animated Ambient Glows -->
  <rect width="1200" height="400" fill="url(#glow-cyan)" />
  <rect width="1200" height="400" fill="url(#glow-purple)" />

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Constellation / Network Lines in Background -->
  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25">
    <line x1="100" y1="80" x2="250" y2="140" stroke-dasharray="4 4" />
    <line x1="250" y1="140" x2="380" y2="90" stroke-dasharray="4 4" />
    <line x1="820" y1="90" x2="980" y2="130" stroke-dasharray="4 4" />
    <line x1="980" y1="130" x2="1100" y2="80" stroke-dasharray="4 4" />
    <circle cx="100" cy="80" r="3" fill="#38bdf8" fill-opacity="0.6" />
    <circle cx="250" cy="140" r="3" fill="#818cf8" fill-opacity="0.6" />
    <circle cx="380" cy="90" r="3" fill="#c084fc" fill-opacity="0.6" />
    <circle cx="820" cy="90" r="3" fill="#38bdf8" fill-opacity="0.6" />
    <circle cx="980" cy="130" r="3" fill="#818cf8" fill-opacity="0.6" />
    <circle cx="1100" cy="80" r="3" fill="#c084fc" fill-opacity="0.6" />
  </g>

  <!-- Dynamic Floating Decorative Pills (Subtle Ambient Motion in lower/side regions) -->
  <g class="floating-card" opacity="0.85">
    <!-- Pill 1: Coding Copilots -->
    <g transform="translate(60, 310)">
      <animateTransform attributeName="transform" type="translate" values="60,310; 60,302; 60,310" dur="5s" repeatCount="indefinite" />
      <rect width="210" height="42" rx="21" fill="#0f172a" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.5" filter="url(#shadow)" />
      <text x="24" y="26" fill="#38bdf8" class="sans" font-size="13" font-weight="600">⚡ Code Copilots</text>
    </g>

    <!-- Pill 2: Autonomous Agents -->
    <g transform="translate(320, 318)">
      <animateTransform attributeName="transform" type="translate" values="320,318; 320,326; 320,318" dur="6s" repeatCount="indefinite" />
      <rect width="230" height="42" rx="21" fill="#0f172a" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.5" filter="url(#shadow)" />
      <text x="24" y="26" fill="#a78bfa" class="sans" font-size="13" font-weight="600">🤖 Autonomous Agents</text>
    </g>

    <!-- Pill 3: Enterprise Workspaces -->
    <g transform="translate(600, 310)">
      <animateTransform attributeName="transform" type="translate" values="600,310; 600,303; 600,310" dur="5.5s" repeatCount="indefinite" />
      <rect width="250" height="42" rx="21" fill="#0f172a" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.5" filter="url(#shadow)" />
      <text x="24" y="26" fill="#38bdf8" class="sans" font-size="13" font-weight="600">🏢 Enterprise Workspaces</text>
    </g>

    <!-- Pill 4: Sovereign Open Source -->
    <g transform="translate(900, 318)">
      <animateTransform attributeName="transform" type="translate" values="900,318; 900,325; 900,318" dur="6.5s" repeatCount="indefinite" />
      <rect width="240" height="42" rx="21" fill="#0f172a" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.5" filter="url(#shadow)" />
      <text x="24" y="26" fill="#34d399" class="sans" font-size="13" font-weight="600">🛡️ Sovereign Open-Source</text>
    </g>
  </g>

  <!-- Animated Horizon Scan Wave / Pulse -->
  <path d="M 0 380 Q 300 370 600 380 T 1200 380" fill="none" stroke="url(#title-grad)" stroke-width="2" stroke-opacity="0.4">
    <animate attributeName="d" 
      values="M 0 380 Q 300 370 600 380 T 1200 380;
              M 0 380 Q 300 390 600 380 T 1200 380;
              M 0 380 Q 300 370 600 380 T 1200 380" 
      dur="8s" repeatCount="indefinite" />
  </path>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast, clean & never obscured -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Top Badge / Pill -->
    <g transform="translate(0, 52)">
      <rect x="-150" y="0" width="300" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.75" stroke="#6366f1" stroke-width="1" />
      <circle cx="-128" cy="14" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="6" y="19" fill="#c7d2fe" class="mono" font-size="11" font-weight="600" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#title-grad)" class="sans" font-size="44" font-weight="800" letter-spacing="-1" filter="url(#glow-text)">
      Awesome Generative AI Copilot
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#f8fafc" class="sans" font-size="20" font-weight="500" letter-spacing="0.2">
      Top Generative AI Copilots, Autonomous Agents &amp; Context-Aware Productivity Tools
    </text>

    <!-- Supporting Tagline / Keywords -->
    <text x="0" y="235" fill="#94a3b8" class="sans" font-size="14" font-weight="400">
      Enterprise SaaS Platforms • Self-Hosted Open-Source LLMs • Agentic Workflows • Developer Productivity
    </text>
  </g>
</svg>
